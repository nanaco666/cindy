name: pr-template-rules

on:
  pull_request:
    paths:
      - 'scripts/check-pr-template-rules.mjs'
      - '.github/PULL_REQUEST_TEMPLATE.md'
      - '.github/workflows/pr-template-rules.yml'
  push:
    branches:
      - main
    paths:
      - 'scripts/check-pr-template-rules.mjs'
      - '.github/PULL_REQUEST_TEMPLATE.md'
      - '.github/workflows/pr-template-rules.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: check:pr-template-rules
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Verify PR template rules
        run: node scripts/check-pr-template-rules.mjs
