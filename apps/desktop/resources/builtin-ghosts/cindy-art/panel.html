<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>画廊</title>
  <link rel="stylesheet" href="panel.css" />
</head>
<body>
  <!-- 被动画布:只听电子脑广播上墙,无任何输入控件(主循环铁则)。
       结构约束:#wall 只管滚动(限高),#flow 只管分列(不限高)——
       columns 写在限高滚动容器上时,溢出内容会进横向溢出列而不是把
       容器撑高,纵向滚动条永远不出现(CSS 多列规范行为)。 -->
  <main id="wall">
    <div id="flow">
      <p id="empty" class="empty">画廊还空着。<br />在聊天里说「画一张……」试试。</p>
    </div>
  </main>
  <script src="panel.js"></script>
</body>
</html>
