<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<!-- Cindy Slack 自定义设置区(意识自绘,cindy-ghost:// 沙箱页)。
     主流程 = 直接「连接账号」:应用身份内置、client secret 在 XDMaker 服务端
     (broker 模式),没有任何需要用户填的凭证——所以本页没有自填 client 区
     (/oauth/<key>/client 在 broker 模式下是 405)。
     只读 / 读写两档连接 = /oauth connect 的 scopes 子集参数(只读不带写 scope,
     Slack 托管 MCP 便不暴露发消息类工具)。注意 Slack 的 scope 授权是累加式的:
     历史授过读写的账号,重连只读拿到的令牌仍可能带写 scope。
     安全模型:授权由主机拉浏览器执行(回调经 broker https 弹跳回本机 53683),
     本页只见账号元数据(用户标识/状态),令牌字节不经过这里。 -->
<style>
  * { box-sizing: border-box; margin: 0; }
  body {
    padding: 2px 0 0;
    color: var(--text-primary, #1a1a1a);
    font: 13px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  .label-row { display: flex; align-items: center; gap: 8px; }
  .label-row .name { font-weight: 500; }
  .badge {
    padding: 1px 8px; border-radius: 6px; font-size: 11px;
    background: var(--surface-chip, #efefec); color: var(--text-tertiary, #8a8a86);
  }
  .input-row { display: flex; align-items: center; gap: 8px; margin-top: 10px; }
  .btn {
    width: 128px; padding: 5px 16px; border-radius: 999px; cursor: pointer; flex: 0 0 auto;
    border: 1px solid var(--border-default, #e4e4e0);
    background: transparent; color: var(--text-primary, #1a1a1a);
    font: inherit; font-weight: 500; text-align: center;
  }
  .btn:hover { background: var(--surface-chip, #efefec); }
  .btn:disabled { opacity: 0.5; cursor: default; }
  .hint-line { margin-top: 6px; font-size: 11px; color: var(--text-tertiary, #8a8a86); }
  .account {
    display: flex; align-items: center; gap: 8px; margin-top: 8px;
    padding: 6px 12px; border: 1px solid var(--border-default, #e4e4e0);
    border-radius: 10px; background: var(--surface-elevated, #ffffff);
  }
  .account .who { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .account .tag { font-size: 11px; color: var(--text-tertiary, #8a8a86); flex: 0 0 auto; }
  .account .tag.expired { color: var(--error-fg, #b53333); }
  .account .mini {
    padding: 2px 10px; border-radius: 999px; font-size: 11px; cursor: pointer; flex: 0 0 auto;
    border: 1px solid var(--border-default, #e4e4e0); background: transparent;
    color: var(--text-secondary, #55554f); font-family: inherit;
  }
  .account .mini:hover { background: var(--surface-chip, #efefec); }
  #accounts:empty::after {
    content: '尚未连接账号';
    display: block; margin-top: 8px; font-size: 11px; color: var(--text-tertiary, #8a8a86);
  }
  #status { margin-top: 10px; font-size: 11px; color: var(--text-tertiary, #8a8a86); min-height: 16px; }
  /* 空着不占位:没有消息时整行退场,别在卡片底部留一截空白。 */
  #status:empty { display: none; }
</style>
</head>
<body>
  <div class="label-row">
    <span class="name">Slack 账号</span>
    <span class="badge">官方 MCP</span>
  </div>
  <div id="accounts"></div>
  <div class="input-row">
    <button id="connect-rw" class="btn" type="button">连接账号(读写)</button>
    <button id="connect-ro" class="btn" type="button">只读连接</button>
  </div>
  <p class="hint-line">读写 = 可搜索阅读 + 发消息/加 reaction;只读 = 仅搜索与阅读。</p>
  <p id="status"></p>
  <script src="/settings.js"></script>
</body>
</html>
