<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<!-- 飞书意识自定义设置区(意识自绘,cindy-ghost:// 沙箱页)。
     凭证 = source:'oauth' + tokenBroker:'feishu':本页「连接账号」经 /oauth
     协议通道让主机拉浏览器跑授权,令牌交换/刷新全在主机与 Cindy 服务端,
     本页与插件代码都接触不到令牌字节。broker 模式没有自填 client 通道
     (/oauth/<key>/client 是 405),所以本页没有任何输入项。
     账号卡展示主机回查的 { label(姓名), avatarDataUrl(头像 data URL),
     status },带「重新授权」(同身份合并,只换令牌不堆行)与「断开」。
     「测试连接」由电子脑代跑:fetch('/wake') 叫醒后经 BroadcastChannel
     递活,电子脑 cindy.fetch GET /open-apis/authen/v1/user_info(令牌由
     主机注入)后把结果广播回来——本页零网络直连。 -->
<style>
  * { box-sizing: border-box; margin: 0; }
  body {
    padding: 2px 0 0;
    color: var(--text-primary, #1a1a1a);
    font: 13px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  .label-row { display: flex; align-items: center; gap: 8px; padding-left: 2px; }
  .label-row .name { font-weight: 500; }
  .badge {
    padding: 1px 8px; border-radius: 6px; font-size: 11px;
    background: var(--surface-chip, #efefec); color: var(--text-tertiary, #8a8a86);
  }
  .note { margin-top: 8px; padding-left: 2px; font-size: 12px; color: var(--text-secondary, #55554f); }
  .account {
    display: flex; align-items: center; gap: 10px; margin-top: 8px;
    padding: 6px 12px; border: 1px solid var(--border-default, #e4e4e0);
    border-radius: 10px; background: var(--surface-elevated, #ffffff);
  }
  .account .avatar {
    width: 24px; height: 24px; border-radius: 50%; flex: 0 0 auto;
    object-fit: cover; background: var(--surface-chip, #efefec);
  }
  /* 无头像回落:姓名首字圆片(与 <img> 同尺寸,布局不跳)。 */
  .account .avatar-fallback {
    width: 24px; height: 24px; border-radius: 50%; flex: 0 0 auto;
    display: flex; align-items: center; justify-content: center;
    background: var(--surface-chip, #efefec); color: var(--text-secondary, #55554f);
    font-size: 12px; font-weight: 500;
  }
  .account .who { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .account .tag { font-size: 11px; color: var(--text-tertiary, #8a8a86); flex: 0 0 auto; }
  .account .tag.expired { color: var(--error-fg, #b53333); }
  .account .mini {
    padding: 2px 10px; border-radius: 999px; font-size: 11px; cursor: pointer; flex: 0 0 auto;
    border: 1px solid var(--border-default, #e4e4e0); background: transparent;
    color: var(--text-secondary, #55554f); font-family: inherit;
  }
  .account .mini:hover { background: var(--surface-chip, #efefec); }
  .account .mini:disabled { opacity: 0.5; cursor: default; }
  #accounts:empty::after {
    content: '尚未连接账号';
    display: block; margin-top: 8px; font-size: 11px; color: var(--text-tertiary, #8a8a86);
  }
  .input-row { display: flex; align-items: center; gap: 8px; margin-top: 10px; }
  .btn {
    padding: 5px 16px; border-radius: 999px; cursor: pointer; flex: 0 0 auto;
    border: 1px solid var(--border-default, #e4e4e0);
    background: transparent; color: var(--text-primary, #1a1a1a);
    font: inherit; font-weight: 500;
  }
  .btn:hover { background: var(--surface-chip, #efefec); }
  .btn:disabled { opacity: 0.5; cursor: default; }
  #status { margin-top: 8px; font-size: 11px; color: var(--text-tertiary, #8a8a86); min-height: 16px; }
  #status:empty { display: none; }
</style>
</head>
<body>
  <div class="label-row">
    <span class="name">飞书账号</span>
    <span class="badge">open.feishu.cn</span>
  </div>
  <p class="note">点「连接账号」在浏览器完成飞书授权即可使用——令牌由主机与 Cindy 服务端托管并自动刷新,插件代码接触不到。</p>
  <div id="accounts"></div>
  <div class="input-row">
    <button id="connect" class="btn" type="button">连接账号</button>
    <button id="test" class="btn" type="button">测试连接</button>
  </div>
  <p id="status"></p>
  <script src="/settings.js"></script>
</body>
</html>
